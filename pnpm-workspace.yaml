packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  '@types/node': '^24.0.0'
  typescript: '^6.0.2'

overrides:
  body-parser: '>=2.4.0'
  deepmerge-ts: '>=8.0.0'
  multer: '>=2.5.0'

minimumReleaseAgeExclude:
  - bullmq@6.3.17

allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  unrs-resolver: true
