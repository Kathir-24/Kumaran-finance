name: Kumaran Chits CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality-and-tests:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chitflow_test
          POSTGRES_PASSWORD: chitflow_test_password
          POSTGRES_DB: chitflow_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install Dependencies
        working-directory: apps/api
        run: npm install

      - name: Run Oxlint (Code Quality & Style)
        working-directory: apps/api
        run: npm run lint

      - name: Validate Prisma Schema & Generate Client
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://chitflow_test:chitflow_test_password@localhost:5432/chitflow_test_db?schema=public
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed

      - name: Run Unit & Financial Invariant Tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://chitflow_test:chitflow_test_password@localhost:5432/chitflow_test_db?schema=public
        run: npm test

      - name: Compile NestJS Application
        working-directory: apps/api
        run: npm run build
