name: Kumaran Chits CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality-and-tests:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chitflow_test
          POSTGRES_PASSWORD: chitflow_test_password
          POSTGRES_DB: chitflow_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Oxlint (Code Quality & Style)
        run: pnpm --filter api run lint

      - name: Validate Prisma Schema & Generate Client
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://chitflow_test:chitflow_test_password@localhost:5432/chitflow_test_db?schema=public
        run: |
          pnpm exec prisma validate
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed

      - name: Run Unit & Financial Invariant Tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://chitflow_test:chitflow_test_password@localhost:5432/chitflow_test_db?schema=public
        run: pnpm test

      - name: Verify Real PostgreSQL Row-Lock Concurrency & Zero Double-Spending
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://chitflow_test:chitflow_test_password@localhost:5432/chitflow_test_db?schema=public
        run: pnpm test test/concurrency-postgres.spec.ts

      - name: Run Multi-Role E2E Integration Tests (82 Tests)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://chitflow_test:chitflow_test_password@localhost:5432/chitflow_test_db?schema=public
          TEST_DATABASE_URL: postgresql://chitflow_test:chitflow_test_password@localhost:5432/chitflow_test_db?schema=public
          STORAGE_DRIVER: local
        run: pnpm run test:e2e

      - name: Compile NestJS Application
        run: pnpm --filter api run build

      - name: Build & Test Shared Client API SDK (@kumaran/api-client)
        run: |
          pnpm --filter @kumaran/api-client build
          pnpm --filter @kumaran/api-client test

      - name: Verify Client SDK Contract Drift Prevention
        run: |
          pnpm run codegen:ts
          pnpm run codegen:dart
          git diff --exit-code packages/api-client/src/generated/ apps/mobile/lib/core/api/models/

      - name: Validate Docker Compose Orchestration Blueprints
        run: |
          docker compose -f infra/docker/docker-compose.yml config --quiet
          docker compose -f infra/docker/docker-compose.fullstack.yml config --quiet

  web-quality-and-build:
    name: Web Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, Build & Test Shared Client API SDK (@kumaran/api-client)
        run: |
          pnpm --filter @kumaran/api-client run typecheck
          pnpm --filter @kumaran/api-client run build
          pnpm --filter @kumaran/api-client test

      - name: Run Next.js ESLint
        run: pnpm --filter web run lint

      - name: Run TypeScript Typecheck (App & Tests)
        run: pnpm --filter web run typecheck

      - name: Run Web Unit Tests
        run: pnpm --filter web test

      - name: Compile Next.js Production Standalone Build
        env:
          BUILD_STANDALONE: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm --filter web run build

  docker-build-and-publish:
    name: Docker Build & Container Registry
    needs: [code-quality-and-tests, web-quality-and-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Lowercase Image Names
        run: |
          echo "API_IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kumaran-chits-api" >> $GITHUB_ENV
          echo "WEB_IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kumaran-chits-web" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push API Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Extract Docker Metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Web Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
