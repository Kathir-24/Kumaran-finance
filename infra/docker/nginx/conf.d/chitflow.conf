# ==============================================================================
# Kumaran Chits — Virtual Host Reverse Proxy & Production TLS Configuration
# Company: Kumaran Finance (Perundurai, Erode, Tamil Nadu)
# Compliance: docs/06-devops/infrastructure-and-drp.md (§1, §4)
# Upstreams: NestJS 12 API (:3000) & Next.js 15 Web Portal (:3001)
# ==============================================================================

upstream api_upstream {
    least_conn;
    server api:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream web_upstream {
    server web:3001;
    keepalive 32;
}

# -------------------------------------------------------------
# 1. HTTP Ingress (Port 80) — ACME Challenge & HTTPS Redirection
# -------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name localhost kumaranfinance.in www.kumaranfinance.in _;

    # Let's Encrypt / Certbot Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Health Check (Allowed over HTTP for container orchestrator readiness/liveness checks)
    location ~* ^/health(/readiness|/liveness)?$ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
        access_log off;
    }

    # Redirect all other HTTP traffic to HTTPS (301 Permanent)
    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------
# 2. HTTPS Production Ingress (Port 443)
# -------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost kumaranfinance.in www.kumaranfinance.in _;

    # SSL / TLS Certificates
    ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Modern TLS Protocols & Cipher Suites (Mozilla Modern Guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Request-ID $request_id always;

    # Default Request-ID Trace Header for All Upstream Proxies
    proxy_set_header X-Request-ID $request_id;

    # Edge Rate Limiting 429 Handler with Retry-After Header
    error_page 429 = @rate_limited;
    location @rate_limited {
        add_header Retry-After 60 always;
        add_header Content-Type application/json always;
        add_header X-Request-ID $request_id always;
        return 429 '{"success":false,"statusCode":429,"error":{"code":"TOO_MANY_REQUESTS","message":"Rate limit exceeded. Please retry in 60 seconds."}}';
    }

    # -------------------------------------------------------------
    # Next.js 15 Web Portal BFF Routes (/api/auth/* & /bff/api/v1/*)
    # Separates HttpOnly-cookie browser BFF traffic from Bearer-auth Mobile /api/v1/*
    # -------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=api_auth_limit burst=10 nodelay;

        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-ID $request_id;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header X-Request-ID $request_id always;
    }

    location ~* ^/bff/api/v1/(customers/[^/]+/documents|disbursements/auction/[^/]+/upload-safety-proof|storage/upload/) {
        client_max_body_size 25M;
        limit_req zone=api_general_limit burst=30 nodelay;

        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-ID $request_id;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header X-Request-ID $request_id always;
    }

    location /bff/api/v1/reports/approvals-stream {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-ID $request_id;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location /bff/ {
        limit_req zone=api_general_limit burst=30 nodelay;

        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-ID $request_id;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header X-Request-ID $request_id always;
    }

    # Scoped Document & Safety Proof Upload Endpoints (Allow up to 25MB payloads)
    location ~* ^/api/v1/(customers/[^/]+/documents|disbursements/auction/[^/]+/upload-safety-proof) {
        client_max_body_size 25M;
        limit_req zone=api_general_limit burst=30 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header X-Request-ID $request_id always;
    }

    # -------------------------------------------------------------
    # Real-Time Server-Sent Events (SSE) Stream
    # Disables proxy buffering & timeouts for live approval notifications
    # -------------------------------------------------------------
    location /api/v1/reports/approvals-stream {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-ID $request_id;

        # Disable buffering and caching for real-time SSE streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # High-Security Auth Gateway: Tiered Edge Rate Limiting (3 req/s, burst 5)
    location /api/v1/auth/ {
        limit_req zone=api_auth_limit burst=5 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;

        # Disable client caching on financial API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header X-Request-ID $request_id always;
    }

    # API Version 1 Gateway: General Edge Rate Limiting (30 req/s, burst 30)
    location /api/ {
        limit_req zone=api_general_limit burst=30 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;

        # Disable client caching on financial API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header X-Request-ID $request_id always;
    }

    # Health Check Endpoints (Readiness & Liveness)
    location ~* ^/health(/readiness|/liveness)?$ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
        access_log off;
    }

    # Bull Board Queue Monitor Dashboard
    location /admin/queues {
        proxy_pass http://api_upstream/admin/queues;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
    }

    # Prometheus Metrics Exporter (HTTP Basic Auth verified at NestJS layer)
    location /metrics {
        proxy_pass http://api_upstream/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-ID $request_id;
    }

    # Next.js Static Chunks & Media (High Cacheability)
    location /_next/static/ {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Request-ID $request_id always;
    }

    # Web Operations Portal / Root (Next.js 15 Standalone)
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;

        # Prevent caching of dynamic HTML documents; ensures client always receives fresh chunk hashes
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Request-ID $request_id always;
    }
}
