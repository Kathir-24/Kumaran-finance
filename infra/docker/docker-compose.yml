services:
  db:
    image: postgres:17
    container_name: chitflow-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - chitflow_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chitflow-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - chitflow_redisdata:/data

volumes:
  chitflow_pgdata:
  chitflow_redisdata:

