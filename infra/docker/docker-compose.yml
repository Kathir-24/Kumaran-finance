services:
  db:
    image: postgres:17
    container_name: chitflow-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - chitflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chitflow} -d ${POSTGRES_DB:-chitflow_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chitflow-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - chitflow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: chitflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chitflow_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chitflow_storage_secret}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - chitflow_miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 2s bash -c '</dev/tcp/localhost/9000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: chitflow-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 ${MINIO_ROOT_USER:-chitflow_admin} ${MINIO_ROOT_PASSWORD:-chitflow_storage_secret}); do
        echo 'Waiting for MinIO API to be ready...';
        sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing minio/${MINIO_DEFAULT_BUCKET:-kumaran-chits-private};
      echo 'MinIO bucket ${MINIO_DEFAULT_BUCKET:-kumaran-chits-private} ready.';
      exit 0;
      "

volumes:
  chitflow_pgdata:
  chitflow_redisdata:
  chitflow_miniodata:
