x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    logging: *default-logging
    image: postgres:17
    container_name: chitflow-db
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_connections=150"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "statement_timeout=15000"
      - "-c"
      - "lock_timeout=5000"
    env_file: .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - chitflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chitflow} -d ${POSTGRES_DB:-chitflow_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: chitflow-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - chitflow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    logging: *default-logging
    image: cgr.dev/chainguard/minio:latest
    container_name: chitflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chitflow_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chitflow_storage_secret}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - chitflow_miniodata:/data

volumes:
  chitflow_pgdata:
  chitflow_redisdata:
  chitflow_miniodata:
