# ==============================================================================
# Kumaran Chits — Production-Parity Full-Stack Docker Compose Orchestration
# Services: PostgreSQL 17, Redis 7, MinIO (S3), NestJS 12 API, Next.js 15 Web, Nginx Ingress, Backup Cron
# Company: Kumaran Finance (Head Office: Perundurai, Erode, Tamil Nadu)
# ==============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    logging: *default-logging
    image: postgres:17
    container_name: chitflow-db
    restart: unless-stopped
    mem_limit: 1024m
    command:
      - "postgres"
      - "-c"
      - "max_connections=150"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "statement_timeout=15000"
      - "-c"
      - "lock_timeout=5000"
    env_file: .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - chitflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chitflow} -d ${POSTGRES_DB:-chitflow_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: chitflow-redis
    restart: unless-stopped
    mem_limit: 640m
    command:
      - "redis-server"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "noeviction"
      - "--save"
      - "900"
      - "1"
      - "--save"
      - "300"
      - "10"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - chitflow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    logging: *default-logging
    image: cgr.dev/chainguard/minio:latest
    container_name: chitflow-minio
    restart: unless-stopped
    mem_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chitflow_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chitflow_storage_secret}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - chitflow_miniodata:/data

  api:
    logging: *default-logging
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: chitflow-api
    restart: unless-stopped
    mem_limit: 1280m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      UV_THREADPOOL_SIZE: "16"
      NODE_OPTIONS: "--max-old-space-size=1024"
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-chitflow}:${POSTGRES_PASSWORD:-chitflow_dev_only}@db:5432/${POSTGRES_DB:-chitflow_dev}?schema=public&connection_limit=25&pool_timeout=10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_DRIVER: s3
      S3_REGION: ap-south-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-chitflow_admin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-chitflow_storage_secret}
      S3_BUCKET: ${MINIO_DEFAULT_BUCKET:-kumaran-chits-private}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: ${JWT_SECRET:-kumaran-chits-dev-secret-key-replace-in-production-2026}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      DEFAULT_FOREMAN_COMMISSION_PERCENT: 4.00
      PRIMARY_BRANCH_CODE: PRD
      # Set ENABLE_BULLMQ_WORKERS=false to run API as a lightweight job producer only (process bulkhead)
      ENABLE_BULLMQ_WORKERS: ${ENABLE_BULLMQ_WORKERS:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "127.0.0.1:3000:3000"

  worker:
    logging: *default-logging
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: chitflow-worker
    restart: unless-stopped
    mem_limit: 1280m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      UV_THREADPOOL_SIZE: "16"
      NODE_OPTIONS: "--max-old-space-size=1024"
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-chitflow}:${POSTGRES_PASSWORD:-chitflow_dev_only}@db:5432/${POSTGRES_DB:-chitflow_dev}?schema=public&connection_limit=15&pool_timeout=10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_DRIVER: s3
      S3_REGION: ap-south-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-chitflow_admin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-chitflow_storage_secret}
      S3_BUCKET: ${MINIO_DEFAULT_BUCKET:-kumaran-chits-private}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: ${JWT_SECRET:-kumaran-chits-dev-secret-key-replace-in-production-2026}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      DEFAULT_FOREMAN_COMMISSION_PERCENT: 4.00
      PRIMARY_BRANCH_CODE: PRD
      # Process Bulkheading: Dedicated worker executes all background queues
      ENABLE_BULLMQ_WORKERS: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3002/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    logging: *default-logging
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: chitflow-web
    restart: unless-stopped
    mem_limit: 512m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      NODE_OPTIONS: "--max-old-space-size=512"
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_BULL_BOARD_URL: ${NEXT_PUBLIC_BULL_BOARD_URL:-http://localhost:3000/admin/queues}
      JWT_SECRET: ${JWT_SECRET:-kumaran-chits-dev-secret-key-replace-in-production-2026}
      # COOKIE_SECURE: "true" # Optional explicit override; otherwise driven by X-Forwarded-Proto https
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"

  nginx:
    logging: *default-logging
    image: nginx:1.27-alpine
    container_name: chitflow-nginx
    restart: unless-stopped
    mem_limit: 256m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_challenge:/var/www/certbot:ro

  certbot:
    logging: *default-logging
    image: certbot/certbot:latest
    container_name: chitflow-certbot
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot_challenge:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"

  backup-cron:
    logging: *default-logging
    image: postgres:17-alpine
    container_name: chitflow-backup-cron
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chitflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chitflow_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-chitflow_dev}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Universal S3 Credentials (compatible with MinIO, Cloudflare R2, and S3)
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-chitflow_admin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-chitflow_storage_secret}
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${MINIO_DEFAULT_BUCKET:-kumaran-chits-private}
    volumes:
      - ../scripts:/scripts:ro
      - ../backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[INIT] Initializing Automated Nightly Backup Cron Runner (02:00 AM IST)..."
        # Install standard S3-compatible protocol CLI client
        apk add --no-cache aws-cli
        
        # Schedule cron at 02:00 AM IST (20:30 UTC = 30 20 * * *)
        # Note: Executed via explicit /bin/sh to respect read-only mounted /scripts volume
        echo "30 20 * * * /bin/sh /scripts/backup-cron-job.sh >> /var/log/backup-cron.log 2>&1" > /etc/crontabs/root
        
        # Start crond daemon in foreground with log level 2
        crond -f -l 2

volumes:
  chitflow_pgdata:
  chitflow_redisdata:
  chitflow_miniodata:
  certbot_challenge:
