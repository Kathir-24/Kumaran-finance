# ==============================================================================
# Kumaran Chits — Production-Parity Full-Stack Docker Compose Orchestration
# Services: PostgreSQL 17, Redis 7, MinIO (S3), MinIO Init, NestJS 12 API
# ==============================================================================

services:
  db:
    image: postgres:17
    container_name: chitflow-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - chitflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chitflow} -d ${POSTGRES_DB:-chitflow_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chitflow-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - chitflow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: chitflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chitflow_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chitflow_storage_secret}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - chitflow_miniodata:/data

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: chitflow-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-chitflow}:${POSTGRES_PASSWORD:-chitflow_dev_only}@db:5432/${POSTGRES_DB:-chitflow_dev}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_DRIVER: s3
      S3_REGION: ap-south-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-chitflow_admin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-chitflow_storage_secret}
      S3_BUCKET: ${MINIO_DEFAULT_BUCKET:-kumaran-chits-private}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: dev-secret-key-at-least-64-characters-long-for-local-docker-fullstack-testing
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      DEFAULT_FOREMAN_COMMISSION_PERCENT: 4.00
      PRIMARY_BRANCH_CODE: PRD
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: chitflow-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

volumes:
  chitflow_pgdata:
  chitflow_redisdata:
  chitflow_miniodata:
